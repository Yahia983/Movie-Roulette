# Production nginx config for the static frontend.
#
# Why this exists (rather than nginx's stock default.conf): the stock
# config just serves static files with no API awareness. Two things are
# genuinely required for a real deployment, not just nice-to-haves:
#
# 1. `frontend/js/api.js` targets same-origin `/api/v1` whenever the page
#    isn't served from `localhost` (see its `API_BASE_URL` logic) — without
#    the proxy_pass block below, every API call in a real deployment would
#    404 against nginx itself, since nginx has nothing else at that path.
#    This was a real latent bug caught during the DevOps hardening pass:
#    docker-compose worked in local dev only because both services were
#    reachable at `localhost` from the browser's perspective either way.
#
# 2. Security headers and caching are not automatic — nginx serves exactly
#    what you configure it to.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    # Defense-in-depth even though the app doesn't currently render any
    # user-supplied HTML unescaped (see title-detail.js's escapeHtml usage)
    # — these cost nothing and stop a future regression from becoming an
    # actual XSS/clickjacking incident.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # --- API proxy ---
    # Forwards /api/v1/* to the backend container. This is what makes the
    # frontend's same-origin API calls actually work in a real deployment
    # (see the comment at the top of this file).
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket-compatible upgrade headers, harmless for plain HTTP and
        # future-proofs this proxy if a feature ever needs a long-lived
        # connection (e.g. live roulette-party mode) without revisiting
        # this config.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Static asset caching ---
    # Short, revalidated cache rather than long-lived immutable caching:
    # this project has no build step and therefore no content-hashed
    # filenames (e.g. `app.a3f9c1.js`) to bust a long cache on deploy — see
    # docs/DEVOPS.md's "Known limitations" section. `must-revalidate`
    # ensures a deploy is picked up on next load rather than silently
    # serving a stale cached asset for its full max-age.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        # `add_header Cache-Control` alone, not combined with an `expires`
        # directive — nginx's `expires` directive sets its own
        # Cache-Control header internally, and combining it with an
        # explicit `add_header` for the same header name produces two
        # separate Cache-Control headers in the response (confirmed via a
        # live test against this exact config), which is invalid/undefined
        # behavior across HTTP clients, not just untidy.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # --- SPA-adjacent fallback ---
    # Not a true single-page app (each page is a real, separately-served
    # HTML file — see docs/FRONTEND.md), so this is only a convenience for
    # a trailing-slash request, not client-side routing support.
    location / {
        try_files $uri $uri/ =404;
    }

    # Health check target for container orchestration — nginx itself
    # responding is a reasonable enough liveness signal for a static file
    # server (unlike the backend, there's no dependency to actually check).
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
