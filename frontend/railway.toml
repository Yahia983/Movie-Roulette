# Railway build/deploy config for the frontend service.
# Set this service's "Root Directory" to `frontend` in the Railway
# dashboard so Railway finds this file and the Dockerfile below it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
