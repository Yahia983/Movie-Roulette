[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is intentionally omitted here and set dynamically in
; alembic/env.py from app.core.config, so migrations always target whatever
; database the app itself is configured for — one source of truth, no drift
; between .env and alembic.ini.

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
