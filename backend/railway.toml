# Railway build/deploy config for the backend service.
# Set this service's "Root Directory" to `backend` in the Railway
# dashboard so Railway finds this file and the Dockerfile below it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
